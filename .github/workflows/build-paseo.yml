name: Build Paseo Image

on:
  push:
    branches: [master]
    paths:
      - "commons-paseo/Dockerfile"
      - "commons-paseo/docker-compose.yml"
      - ".github/workflows/build-paseo.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jobeenterprise/commons-paseo
  PASEO_VERSION: "0.11.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: commons-paseo
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.PASEO_VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Resolve the multi-arch index digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE}:${PASEO_VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Commons Paseo image published"
            echo
            echo '```'
            echo "repo:  ${{ env.IMAGE }}"
            echo "tag:   ${PASEO_VERSION}"
            echo "digest: ${DIGEST}"
            echo '```'
            echo
            echo "Paste the digest into commons-paseo/docker-compose.yml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          MANIFEST=$(docker buildx imagetools inspect "${IMAGE}:${PASEO_VERSION}" \
            --format '{{json .Manifest}}')
          echo "$MANIFEST" | python3 -c "
          import json, sys
          manifest = json.load(sys.stdin)
          platforms = [m.get('platform', {}) for m in manifest.get('manifests', [])]
          archs = [p.get('architecture', '') for p in platforms]
          expected = ['amd64', 'arm64']
          missing = [a for a in expected if a not in archs]
          if missing:
              print(f'MISSING architectures: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'All architectures present: {archs}')
          "
