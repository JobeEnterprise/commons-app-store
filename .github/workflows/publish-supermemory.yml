name: Publish supermemory image

# Builds the multi-arch Supermemory server image and pushes it to GHCR.
# The commons-app-store manifest needs tag AND multi-arch index digest, and
# this workflow is what produces the digest — it is printed in the summary.

on:
  push:
    branches: [master]
    tags: ["supermemory-v*"]
    paths:
      - "build/supermemory/Dockerfile"
      - ".github/workflows/publish-supermemory.yml"
  workflow_dispatch:

# NOTE: literal lowercase owner. ${{ github.repository_owner }} expands to
# "JobeEnterprise", and GHCR rejects any repository name containing uppercase.
env:
  IMAGE: ghcr.io/jobeenterprise/supermemory-local
  SUPERMEMORY_VERSION: "0.0.8"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: build/supermemory
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.SUPERMEMORY_VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Resolve the multi-arch index digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE}:${SUPERMEMORY_VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Supermemory image published"
            echo
            echo '```'
            echo "repo:  ghcr.io/jobeenterprise/supermemory-local"
            echo "tag:   ${SUPERMEMORY_VERSION}"
            echo "digest: ${DIGEST}"
            echo '```'
            echo
            echo "Paste the digest into commons-supermemory/docker-compose.yml"
            echo "as \`image: ghcr.io/jobeenterprise/supermemory-local:${SUPERMEMORY_VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "INDEX_DIGEST=$DIGEST"

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          for arch in linux/amd64 linux/arm64; do
            if docker buildx imagetools inspect "${IMAGE}:${SUPERMEMORY_VERSION}" \
               --format '{{json .Manifest}}' | grep -q "$arch"; then
              echo "ok: $arch present"
            else
              echo "MISSING: $arch — an amd64-only image is uninstallable on a Pi" >&2
              exit 1
            fi
          done