version: "3.7"

services:

  # No web UI in the self-hosted build, so app_proxy exists only to expose the
  # HTTP API through Umbrel's session auth. Umbrel injects the auth cookie by
  # default — do NOT set PROXY_AUTH_ADD: "false" here. Without it, this would be
  # an unauthenticated LAN endpoint on the memory graph.
  app_proxy:
    environment:
      APP_HOST: commons-supermemory_server_1
      APP_PORT: 6767

  server:
    # Tag and digest pinned together per Umbrel packaging guidance. Digest is the
    # multi-arch index digest: covers linux/amd64 and linux/arm64. Built by
    # .github/workflows/publish-supermemory.yml from build/supermemory/Dockerfile.
    image: ghcr.io/jobeenterprise/supermemory-local:0.0.8@sha256:0aaa4f483c3bfc746ab0cc1f4afbe25c5922efd2fecb3e634d7cb5f09ae786ed
    restart: on-failure
    # First boot creates the graph engine and prewarms the local ONNX embedding
    # model. Without a generous start period the healthcheck fails repeatedly
    # during boot and on-failure restarts a process that was booting fine.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    env_file:
      # Committed with placeholders (see settings.env). umbrelOS does not expose
      # a key-entry form, so the user edits this file after install.
      - ${APP_DATA_DIR}/settings.env
    environment:
      PORT: "6767"
      SUPERMEMORY_DATA_DIR: /var/lib/supermemory
      # Ingest is CPU-heavy while embedding. Raised from the 1gb default for
      # faster bulk import on a 4-core / 15 GB device.
      SUPERMEMORY_EMBEDDING_RAM_LIMIT: 2gb
      SUPERMEMORY_INGEST_CONCURRENCY: "2"
    volumes:
      # Graph engine data, auth secret, and the embedding model cache. Everything
      # durable lives here; the container is stateless otherwise.
      - ${APP_DATA_DIR}/data/supermemory:/var/lib/supermemory
    # Ingest can transiently exceed the 2gb ceiling above the boot baseline.
    mem_limit: 3g