description: >-
  **Add your API key after installing, or the app will not start.** See
  "First run" below.


  Supermemory is context infrastructure for AI agents. It ingests text, files,
  and URLs, extracts facts, links them into a semantic graph scoped to a
  container, and serves hybrid semantic search, memory retrieval, and
  automatically maintained user profiles back over an HTTP API.


  This is the self-hosted build running entirely on your Umbrel. Graph storage
  and embeddings are local — ingested documents never leave the device except for
  the metadata sent to the LLM provider you configure for extraction.


  **No web interface.** The self-hosted server is API-only. Use it from an agent
  (Hermes, Claude Code, Codex, OpenCode) or directly over HTTP.


  ## First run

  umbrelOS has no key-entry form, so one file needs editing after install. Open
  the app's data directory and edit `settings.env`, putting your LLM provider key
  in `OPENAI_API_KEY`, then restart the app from the dashboard.


      ~/umbrel/app-data/commons-supermemory/settings.env


  The server runs an interactive setup wizard on first boot and there is no
  wizard without a TTY, so it will sit there waiting for input that never comes.
  Setting the key first is what starts it.


  **Embeddings need no key.** A local English-only ONNX model runs inside the
  container. Multilingual content needs `SUPERMEMORY_EMBEDDING_*` set to match a
  multilingual model, and the dimensions must match any vectors already stored.


  ## What self-hosting does not include

  Google Drive, Notion, Gmail, and OneDrive connectors, the hosted Supermemory
  MCP server, and Supermemory's proprietary extraction models are platform-only
  and are not part of this build. Memory quality depends on whichever model you
  point `OPENAI_MODEL` at.


  ## Data

  Everything lives in this app's data directory under `data/supermemory`. Back
  it up to move or restore your memory graph.
