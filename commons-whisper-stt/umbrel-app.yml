id: commons-whisper-stt
category: ai
name: Whisper STT
version: "1.0.0"
tagline: Private local speech-to-text for your apps
description: >-
  Whisper STT runs OpenAI's Whisper speech recognition entirely on your Umbrel,
  using the whisper.cpp engine. Audio is transcribed on-device — nothing is
  uploaded to a third party, and no API key or account is needed.

  It exposes a plain HTTP transcription endpoint that any app on your Umbrel
  can call. Point Hermes Agent's speech-to-text settings at it and voice
  messages get transcribed locally.

  ## Using It

  The endpoint is reachable on your local network and from other apps on this
  Umbrel. Transcribe an audio file with:

  ```bash
  curl -s http://<umbrel-ip>:18791/inference \
    -F file=@recording.wav \
    -F response_format=json
  ```

  ## Which Model

  This package ships `ggml-base.en` — English-only, a good balance of speed and
  accuracy. It downloads on first start, so the first transcription is slower
  while the model loads. Expect roughly realtime speed on a modern CPU.

  ## Pointing Hermes Agent At It

  In Hermes Agent, add a custom speech-to-text provider that shells out to the
  endpoint:

  ```yaml
  stt:
    enabled: true
    provider: whispercpp
    providers:
      whispercpp:
        type: command
        command: >-
          curl -s http://<umbrel-ip>:18791/inference
          -F file=@{input_path} -F response_format=json
  ```

  ## Performance Note

  Works on any x86 CPU, including low-power ones without AVX. Faster CPUs
  transcribe proportionally faster.
