version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: commons-whisper-stt_server_1
      APP_PORT: 8080
      # No app of its own to authenticate against — whisper-server has no login
      # and no state, it only transcribes the audio you POST to it. The gate is
      # off so other apps on the Umbrel can call it with a plain curl.
      # See the umbrel-app-packaging skill: "the app has no login" is normally a
      # reason to LEAVE the gate on. The exemption here is that the surface is a
      # stateless transcriber with no data at rest and no admin surface, so
      # there is nothing to protect and everything to gain from reachability.
      PROXY_AUTH_ADD: "false"

  # whisper.cpp — plain C/C++, runs on any x86 CPU including SSE-only ones
  # (no AVX required), which is why this works on low-power hardware where
  # faster-whisper / Parakeet / ONNX Runtime do not.
  #
  # The upstream image has ENTRYPOINT ["bash","-c"] and no CMD, so `command`
  # below must be a single shell string. `set -e` is load-bearing: without it a
  # failed model download would fall through and the container would sit in a
  # restart loop with a healthy-looking port that returns nothing.
  server:
    image: ghcr.io/ggerganov/whisper.cpp:main-d2ee117a0a21a3944c0ba0b41d95f097ef18e3f0@sha256:66f5943634946bcd4414becf7fa94855bb31a3b47da626bd83856326921f7277
    restart: on-failure
    init: true
    volumes:
      # Model lives on the app volume so it survives restarts and image updates.
      # Must be a volume, not baked into the image: the model is ~148 MB and is
      # the only thing here that changes.
      - ${APP_DATA_DIR}/data/models:/models
    command:
      - |
        set -e
        MODEL=/models/ggml-base.en.bin
        if [ ! -f "$$MODEL" ]; then
          echo "Downloading ggml-base.en model (first run, ~148 MB)..."
          /app/models/download-ggml-model.sh base.en
          mv /app/models/ggml-base.en.bin "$$MODEL"
        fi
        echo "Starting whisper-server with ggml-base.en"
        # /app/server is the HTTP server binary (mirrors examples/server).
        # /app/main is the plain CLI and takes no --host/--port.
        exec /app/server -m "$$MODEL" --host 0.0.0.0 --port 8080 -t 4 -l en -nt
