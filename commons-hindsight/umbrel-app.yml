description: >-
  **Three values must be set after installing, or the app will not work
  correctly.** See "First run" below.


  Hindsight is memory infrastructure for AI agents. Your agent stores
  information, searches it, and reasons over it — so it stops starting every
  conversation from zero.


  ## What it does


  Search is not a single lookup. Four strategies run in parallel and their
  results merge: **semantic** (concepts and paraphrases), **keyword** (exact
  terms, error strings, names), **graph** (related entities and indirect
  connections), and **temporal** ("last spring", "in June"). That last one is
  what makes "what did we decide about pricing?" answerable months later.


  Facts are also **consolidated** into observations: deduplicated beliefs that
  cite the exact quotes supporting them, updated rather than overwritten when
  new evidence arrives. "User was a React fan but has switched to Vue" survives
  as one belief with history, not two competing facts.


  ## First run


  umbrelOS has no key-entry form, so one file needs editing after install. Open
  the app's data directory, fill in three values in `settings.env`, then restart
  the app from the dashboard.


      ~/umbrel/app-data/commons-hindsight/settings.env


  1. `HINDSIGHT_API_KEY` — a random string you invent (`openssl rand -hex 32`).
     Hindsight ships with **no authentication**, and the API listens on all
     interfaces inside the container. Umbrel's login gates only this app's web UI,
     not the API. Without this key, anything that can reach the container can
     read and write your memories.
  2. `HINDSIGHT_CP_KEY` — a second random string you invent. This is the login
     prompt you see when opening the app.
  3. `HINDSIGHT_API_LLM_API_KEY` — your LLM provider key. OpenRouter is already
     configured as the provider. Any OpenAI-compatible endpoint works —
     Anthropic, Groq, Gemini, or a local llama.cpp or Ollama.


  ## What stays on your device


  The embedder, the reranker, and the database all run inside this container, so
  your memories are never sent to an external embedding service. The **only**
  calls that leave the device are the LLM calls used to extract facts from what
  you store — and those carry that content to whichever provider you configure.


  This is the `full` image, which is why it is larger. The `slim` variant would
  send your memory text to an external embedding provider instead.


  ## Data


  Everything lives in `data/pg0` in this app's data directory — an embedded
  PostgreSQL with the vector extension. Back up that directory to move or
  restore your banks.


  ## Connect an agent


  Hindsight exposes an MCP server inside this container, so any MCP-capable
  client can use it alongside the web UI. The Hermes integration is also
  available as a native memory provider.
