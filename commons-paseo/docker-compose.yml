version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: commons-paseo_server_1
      APP_PORT: 6767
    
  server:
    image: ghcr.io/getpaseo/paseo:latest
    init: true
    restart: unless-stopped
    environment:
      PASEO_PASSWORD: "change-me"
      PASEO_WEB_UI_ENABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/paseo-home:/home/paseo
      - ${APP_DATA_DIR}/workspace:/workspace
