version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: commons-paseo_server_1
      APP_PORT: 6767
      # Paseo does its own password auth and serves its own login screen, so
      # Umbrel auth in front of it would double-prompt and break the WebSocket
      # upgrade the UI depends on.
      PROXY_AUTH_ADD: "false"

  server:
    # Build from the local Dockerfile instead of pulling the upstream image
    # directly. This bakes OpenCode v2 into the image so Paseo auto-discovers
    # it as a provider without any post-install manual steps.
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    # Paseo spawns agent CLIs as child processes and needs real init for
    # reaping. The Tini "not running as PID 1" warning in logs is cosmetic.
    init: true
    environment:
      # Per-install secret from Umbrel. Paired with deterministicPassword: true
      # so the manifest shows the user their real password.
      PASEO_PASSWORD: ${APP_PASSWORD}
      # The bundled web UI is served from the same origin as the API.
      PASEO_WEB_UI_ENABLED: "true"
      # Paseo's DNS-rebinding allowlist defaults to localhost/*.localhost/IPs
      # only, so a request via http://<device>.local:6767 is rejected with 403
      # unless we add the device's own domain.
      PASEO_HOSTNAMES: ${DEVICE_DOMAIN_NAME}
    volumes:
      # Daemon state, config, and agent credentials.
      - ${APP_DATA_DIR}/data/paseo-home:/home/paseo
      # Repositories the launched agents can read and write.
      - ${APP_DATA_DIR}/data/workspace:/workspace
