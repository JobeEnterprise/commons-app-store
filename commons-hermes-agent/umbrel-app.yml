manifestVersion: 1
id: commons-hermes-agent
category: ai
name: Hermes Agent
version: "2026.9.24"
tagline: The AI agent that grows with you
# Real upstream app icon (apps/desktop/assets/icon.png, 1024x1024) via jsDelivr,
# pinned to the release tag so it can't drift. Committed local assets are the
# wrong shape for a community store — the Umbrel community template uses remote
# URLs, and the official linter warns against committing icon/gallery binaries.
icon: https://cdn.jsdelivr.net/gh/NousResearch/hermes-agent@v2026.9.24/apps/desktop/assets/icon.png
description: >-
  Hermes Agent is an AI agent that gets better the more you use it by creating
  its own skills, storing user preferences, and updating its memory.

  Use Hermes Agent to browse the web, edit files, run shell commands, connect
  services like Telegram, Signal, WhatsApp, and Discord, save reusable skills,
  and remember important details across sessions.

  Hermes Agent runs inside the Umbrel app sandbox, so it can work freely inside
  its own environment while your other apps and data stay separate.

  ## What It Does

    - **Chat and act** - Ask questions, automate tasks, and let Hermes use tools for you.

    - **Works across channels** - Connect chat apps and keep talking to the same agent wherever you want.

    - **Remembers your workflow** - Save preferences, context, and reusable skills that carry across sessions.

    - **Manage it from the dashboard** - Configure settings, review activity, and monitor the agent from your browser.
developer: Nous Research
website: https://hermes-agent.nousresearch.com
dependencies: []
repo: https://github.com/NousResearch/hermes-agent
support: https://github.com/NousResearch/hermes-agent/issues
port: 18790
gallery: []
# Gallery is intentionally empty. The official store's 1.jpg-4.jpg are hosted
# by Umbrel privately and are not reusable. Upstream ships no web-dashboard
# screenshots — the only UI images in the repo are macOS Desktop PR assets that
# would misrepresent what an Umbrel user sees (the web dashboard at /chat).
# Add your own dashboard screenshots here after first install.
path: "/chat"
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
releaseNotes: >-
  Hermes Agent v0.21.5 (v2026.9.24) — patch release rolling up ~460 PRs since
  v0.21.4 into a stable tagged release. Full curated notes deferred to v0.22.0.

  Highlights in this window: a Desktop plugin SDK wave, Simple/Advanced interface
  mode, the Connectors page replacing the MCP tab, onboarding that offers catalog
  plugins, French/German/Spanish Desktop catalogs, RTL/LTR text direction,
  custom model entry from the composer, per-profile stop/start/restart, kanban
  design pass, webhook delivery mirroring, Bot Screen on hosted images, GPT-6
  Sol/Terra/Luna and Claude Opus 5.5 in the catalogs, an official Blender Lab
  integration, and extensive hot-path performance work. Nothing in this window
  is skipped.

  This Umbrel package uses the upstream image directly (Docker Hub
  nousresearch/hermes-agent) rather than getumbrel's wrapper, so it ships the
  latest code rather than the wrapper's stale v0.21.3. The wrapper's
  HERMES_UMBREL_APP_PROXY_AUTH hook is replaced with dashboard basic auth
  (username: admin, password: the Umbrel-displayed app password).

  Full release notes: https://github.com/NousResearch/hermes-agent/releases/tag/v2026.9.24
submitter: JobeEnterprise
submission: https://github.com/JobeEnterprise/commons-app-store
