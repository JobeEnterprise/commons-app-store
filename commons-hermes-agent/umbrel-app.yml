releaseNotes: >-
  Hermes Agent v0.22.2 — Latest upstream release.

  This Umbrel package builds on the upstream image (Docker Hub
  nousresearch/hermes-agent) and adds:
    - GPU drivers (Vulkan/Mesa) for Intel integrated graphics
    - Memory patch: cgroup-aware RAM sizing for container limits
    - Dashboard basic auth (username: admin, password: the Umbrel-displayed app password)
    - Hermes Desktop app connectivity (no umbrelOS proxy auth gate)

  The getumbrel wrapper's HERMES_UMBREL_APP_PROXY_AUTH hook is replaced with
  dashboard basic auth, so the Hermes Desktop app can connect directly.

  Full release notes: https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.2
submitter: JobeEnterprise
