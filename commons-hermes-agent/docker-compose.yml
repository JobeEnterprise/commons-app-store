version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: commons-hermes-agent_web_1
      APP_PORT: 18789
      # Disable the umbrelOS app-proxy's own login gate.
      #
      # Why: the proxy requires an umbrelOS session cookie before it forwards
      # anything, and Hermes Desktop cannot present one — it speaks only a legacy
      # `?token=` or an OAuth `?ticket=` minted against a Hermes login cookie.
      # A WebSocket upgrade cannot be redirected to a login page, so the proxy
      # answers 401 and the desktop reports
      # "Could not connect to Hermes gateway (websocket error before open)".
      #
      # umbrelOS reads this key as a fail-safe: auth is on unless the value reads
      # "false" (app-gateway.ts:95, and app.ts:1360 falls back to the same test
      # for an app stopped since the gateway config was last rendered). Quoted
      # here to match the official linter's accepted form; a YAML boolean false
      # also works.
      #
      # SECURITY: this publishes Hermes on the LAN with no umbrelOS gate in front.
      # The only remaining wall is the dashboard basic auth below
      # (admin + the password Umbrel displays). Do not remove that provider
      # without replacing it — the dashboard hard-requires an auth provider on
      # non-loopback binds.
      PROXY_AUTH_ADD: "false"

  # Hermes Agent gateway + dashboard + TUI, supervised by upstream s6-overlay.
  # Uses the upstream image directly instead of getumbrel's wrapper, so we get
  # v0.21.5 (v2026.9.24) rather than the wrapper's stale v0.21.3 (v2026.9.14) —
  # getumbrel has not updated since 2026-09-17.
  #
  # NOTE: the image lives on Docker Hub, NOT ghcr.io. The release notes list it
  # as `nousresearch/hermes-agent:v2026.9.24` with no registry prefix, and a
  # ghcr.io/... path 403s on pull.
  #
  # Digest is the multi-arch index digest (covers both linux/amd64 and
  # linux/arm64), so one pin serves an x86 N5105 and a Raspberry Pi.
  #
  # The upstream image has no HERMES_UMBREL_APP_PROXY_AUTH hook — the getumbrel
  # wrapper's proxy-auth bypass is replaced here with dashboard basic auth
  # wired to the Umbrel-injected $APP_PASSWORD. Umbrel displays the password
  # (deterministicPassword: true in manifest) and the same credential logs you
  # into the dashboard.
  web:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/hermes:/opt/data
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "18789"
      # Dashboard basic auth — replaces the wrapper's proxy-auth hook.
      # $APP_PASSWORD is injected by Umbrel per-install; deterministicPassword
      # in the manifest makes Umbrel display it to the user.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "admin"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${APP_PASSWORD}"
      # Upstream TUI path (wrapper overrides to /app/umbrel-tui).
      HERMES_TUI_DIR: "/opt/hermes/ui-tui"
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
    command: ["gateway", "run"]
