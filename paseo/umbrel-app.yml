manifestVersion: 1
id: paseo
category: developer
name: Paseo
version: "0.10.1"
tagline: The control plane for coding agents
icon: https://raw.githubusercontent.com/getpaseo/paseo/main/packages/website/public/favicon.svg
description: >-
  **Your daemon password is shown by Umbrel** when you install this app. Keep it
  somewhere safe — the API and WebSocket are unreachable without it.


  Paseo runs your coding agents on your Umbrel and lets you drive them from a
  browser, phone, or CLI. Supports Claude Code, Codex, OpenCode, Pi, and 34+
  more providers.


  **No agents are bundled.** Paseo manages agent CLIs, it doesn't ship one.
  Install at least one yourself before the app is useful, then authenticate it:

      docker exec -it --user paseo paseo_server_1 claude
      docker exec -it --user paseo paseo_server_1 codex

  Agent credentials persist in app data. Paseo also wants the `gh` CLI
  authenticated for PR-aware worktrees and orchestration.


  Your code lives in the `workspace` folder in this app's data directory, and
  stays on your machine. Paseo has no telemetry and no forced login.
releaseNotes: >-
  First working release on Umbrel.


  Fixes a permission failure that prevented the daemon from creating its state
  directory, and a 403 that blocked the web UI from loading behind Umbrel's
  proxy. The daemon password is now generated per-install and shown by Umbrel
  instead of a shared placeholder.


  Upstream release notes: https://github.com/getpaseo/paseo/releases/tag/v0.10.1

